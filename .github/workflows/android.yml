name: Android assembleDebug
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare disposable HTTPS API and test-only certificate
        env:
          WEB_DIR: ${{ github.workspace }}/web/dist
        run: |
          pip install -r backend/requirements.lock.txt
          mkdir -p android/app/src/androidTest/assets
          openssl req -x509 -newkey rsa:2048 -nodes -keyout "$RUNNER_TEMP/crs-ci.key" -out android/app/src/androidTest/assets/ci-ca.pem -days 1 -subj "/CN=crs-ci" -addext "subjectAltName=IP:10.0.2.2,DNS:localhost,IP:127.0.0.1"
          python backend/tests/android_server.py --cert android/app/src/androidTest/assets/ci-ca.pem --key "$RUNNER_TEMP/crs-ci.key" > "$RUNNER_TEMP/crs-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -ksf https://127.0.0.1:8443/ready; then break; fi
            sleep 1
          done
          curl -ksf https://127.0.0.1:8443/ready
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes Android SDK and command-line tools.
      # setup-android@v3 currently tries to install removed SDK package "tools".
      - name: Install required Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: cd android && gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease -PapiBaseUrl=https://example.invalid/api/v1 --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Room migrations and form recreation on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: cd android && gradle :app:connectedDebugAndroidTest -PapiBaseUrl=https://example.invalid/api/v1 -PcrsTestApiBase=https://10.0.2.2:8443/api/v1 --stacktrace
      - name: Prove real HTTPS Worker test ran (not skipped)
        run: |
          python - <<'PYPROOF'
          import json,ssl,urllib.request
          context=ssl.create_default_context(cafile='android/app/src/androidTest/assets/ci-ca.pem')
          with urllib.request.urlopen('https://127.0.0.1:8443/api/v1/test/stats',context=context) as response:
              stats=json.load(response)
          assert stats=={'photo_put_count':2,'submit_count':2,'lost_response_count':1},stats
          print('Verified HTTPS Worker: stored photos, lost acknowledgement recovery and revised submit')
          PYPROOF
      - name: Web reads the same report created by Android
        run: |
          cd web
          npx playwright install --with-deps chromium
          npx playwright test --config=playwright.integration.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            web/test-results/android-integration/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: construction-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: construction-android-release-unsigned
          path: android/app/build/outputs/apk/release/*-unsigned.apk
          retention-days: 14
