name: Android assembleDebug
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # ubuntu-latest already includes Android SDK and command-line tools.
      # setup-android@v3 currently tries to install removed SDK package "tools".
      - name: Install required Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: cd android && gradle :app:testDebugUnitTest :app:assembleDebug -PapiBaseUrl=https://example.invalid/api/v1 --stacktrace
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Room migrations and form recreation on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: cd android && gradle :app:connectedDebugAndroidTest -PapiBaseUrl=https://example.invalid/api/v1 --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: construction-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
