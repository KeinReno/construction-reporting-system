name: Windows runtime package
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.lock.txt
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web run build
      - name: Actual PowerShell install, migration, startup and public Web
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_release.py backend/tests/test_windows_runtime.py
      - run: python scripts/package_release.py --output construction-windows-runtime.zip
      - uses: actions/upload-artifact@v4
        with:
          name: construction-windows-runtime
          path: construction-windows-runtime.zip
          retention-days: 14
